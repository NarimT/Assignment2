<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A2 Language Model Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      line-height: 1.6;
    }
    textarea {
      width: 100%;
      height: 90px;
      font-size: 14px;
      padding: 8px;
    }
    input {
      margin: 5px 0;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      white-space: pre-wrap;
      border-radius: 4px;
    }
    .controls {
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>A2: LSTM Language Model</h1>
  <p>
    Enter a text prompt and the model will generate a continuation
    in the style of Shakespeare.
  </p>

  <form method="POST">
    <label><b>Prompt</b></label><br>
    <textarea name="prompt" placeholder="Type your prompt here...">{{ prompt }}</textarea>

    <div class="controls">
      <label>Max new tokens:</label>
      <input type="number" name="max_new" value="{{ max_new }}" min="1" max="200">

      <label style="margin-left:15px;">Temperature:</label>
      <input type="number" step="0.1" name="temperature" value="{{ temperature }}" min="0.1" max="2.0">
    </div>

    <button type="submit">Generate</button>
  </form>

  <h2>Generated Output</h2>
  <pre>{{ output }}</pre>

</body>
</html>
